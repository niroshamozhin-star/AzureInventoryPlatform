name: Build and push Docker image

# Phase 12/13: Azure Container Registry Tasks (the cloud-build feature) is
# blocked on this free-trial subscription (TasksOperationsNotAllowed), so
# GitHub's own runners do the build instead - they already have Docker
# installed, so this is a normal docker build + push, not an ACR Task.
# Build+push only - the live App Service stays on its existing Code
# deployment, this workflow never touches it.
on:
  push:
    branches: [master]
    paths:
      - "Dockerfile"
      - "src/AzureInventoryPlatform.Web/**"
      - ".github/workflows/docker-build-push.yml"
  workflow_dispatch: {}

env:
  IMAGE_NAME: niro-inventory-web

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:latest
            ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
